name: matchesnap

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  minio:
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
      args:
        MINIO_VERSION: RELEASE.2024-12-18T13-15-44Z
    image: matchesnap-minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: https://${MEDIA_DOMAIN}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      INSIGHTFACE_MODEL: ${INSIGHTFACE_MODEL}
      INSIGHTFACE_ROOT: /models
      MATCH_THRESHOLD: ${MATCH_THRESHOLD}
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD}
      RECONCILIATION_ENABLED: ${RECONCILIATION_ENABLED}
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS}
      RECONCILIATION_BATCH_SIZE: ${RECONCILIATION_BATCH_SIZE}
      RECONCILIATION_TOP_K: ${RECONCILIATION_TOP_K}
      JWT_SECRET: ${JWT_SECRET}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET}
      OTP_DELIVERY_MODE: ${OTP_DELIVERY_MODE}
      TELNYX_API_KEY: ${TELNYX_API_KEY}
      TELNYX_VERIFY_PROFILE_ID: ${TELNYX_VERIFY_PROFILE_ID}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS}
      OTP_MAX_REQUESTS_PER_HOUR: ${OTP_MAX_REQUESTS_PER_HOUR}
      OTP_MAX_VERIFICATION_ATTEMPTS: ${OTP_MAX_VERIFICATION_ATTEMPTS}
      MEETING_CODE_SECRET: ${MEETING_CODE_SECRET}
      MEETING_CODE_TTL_SECONDS: ${MEETING_CODE_TTL_SECONDS}
      AUDIT_ADMIN_KEY: ${AUDIT_ADMIN_KEY}
      AUDIT_UPLOAD_BURST_LIMIT: ${AUDIT_UPLOAD_BURST_LIMIT}
      AUDIT_FAILED_ACTION_LIMIT: ${AUDIT_FAILED_ACTION_LIMIT}
      AUDIT_MAX_INSTALLATIONS_PER_ACCOUNT: ${AUDIT_MAX_INSTALLATIONS_PER_ACCOUNT}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS}
      AUDIT_INSTALLATION_INACTIVITY_DAYS: ${AUDIT_INSTALLATION_INACTIVITY_DAYS}
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    logging: *default-logging

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *default-logging

volumes:
  db-data:
  minio-data:
  models:
  caddy-data:
  caddy-config:
