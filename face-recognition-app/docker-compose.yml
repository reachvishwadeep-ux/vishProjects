services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: facerec
      POSTGRES_PASSWORD: facerec
      POSTGRES_DB: facerec
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facerec -d facerec"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://facerec:facerec@db:5432/facerec
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://10.0.2.2:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: faces
      INSIGHTFACE_ROOT: /models
      RECONCILIATION_INTERVAL_SECONDS: 900
      JWT_SECRET: ${JWT_SECRET:-local-demo-jwt-secret-change-before-sharing}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-local-demo-otp-secret-change-before-sharing}
      OTP_DELIVERY_MODE: ${OTP_DELIVERY_MODE:-development}
      MEETING_CODE_SECRET: ${MEETING_CODE_SECRET:-local-demo-meeting-secret-change-before-sharing}
    ports:
      - "8000:8000"
    volumes:
      # Cache the ~300 MB of ONNX weights so they survive container rebuilds.
      - models:/models

volumes:
  db-data:
  minio-data:
  models:
